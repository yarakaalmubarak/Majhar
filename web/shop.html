<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marhaba Pass</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%20role%3D%22img%22%20aria-label%3D%22Majhar%22%3E%20%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2235%22%20fill%3D%22none%22%20stroke%3D%22%231c1a36%22%20stroke-width%3D%2210%22/%3E%20%20%3Cline%20x1%3D%2276%22%20y1%3D%2276%22%20x2%3D%22103%22%20y2%3D%22103%22%20stroke%3D%22%231c1a36%22%20stroke-width%3D%2215%22%20stroke-linecap%3D%22round%22/%3E%20%20%3Cg%20fill%3D%22%230e6b4f%22%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2235%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2235%22%20r%3D%225.5%22/%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%20%20%3C/g%3E%20%20%3Ccircle%20cx%3D%2265%22%20cy%3D%2235%22%20r%3D%227%22%20fill%3D%22%23e3a21a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1c1a36;--night2:#2b2752;--ink:#1a2421;--mute:#5f6a66;--line:#e3e7e5;--bg:#f7f8f7;
--green:#0e6b4f;--greenbg:#e3f1eb;--saffron:#b77d0c;--saffronbg:#fcf1d8;--red:#c8372d;--redbg:#fbe8e6;--blue:#2f5fb3;--bluebg:#e7eefb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Arabic",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #7aa8ff;outline-offset:2px}
.top{background:var(--night);color:#fff;padding:14px 16px 0}
.bar{display:flex;align-items:center;gap:8px}
.brand{font-weight:700;font-size:18px;flex:1}
.lang{display:flex;background:#ffffff1f;border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#fff;padding:3px 10px;border-radius:999px;font-size:13px}
.lang button.on{background:#fff;color:var(--night)}
.who{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:13px;color:#cfcbef}
.who input{width:110px;border:0;border-radius:8px;padding:4px 8px;font:inherit;font-size:14px}
.hero{margin:14px -16px 0;padding:20px 16px 22px;background:linear-gradient(160deg,var(--night2),var(--night) 70%)}
.hero h1{margin:0;font-size:26px;line-height:1.15;font-weight:700}
.hero p{margin:6px 0 0;color:#cfcbef;font-size:14px}
main{padding:14px 14px 110px}
h2{font-size:15px;font-weight:600;margin:18px 2px 8px;color:var(--mute)}
.tt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.tt .n{font-weight:600}.tt .p{font-size:20px;font-weight:700}.tt .l{font-size:13px;color:var(--mute)}.tt .l.low{color:var(--red);font-weight:600}
.tt .grow{flex:1}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.step button{border:0;background:#fff;width:30px;height:30px;font-size:18px;color:var(--green)}
.step button:disabled{color:#bbb;cursor:default}
.step span{min-width:22px;text-align:center;font-weight:600}
.add{border:0;background:var(--green);color:#fff;border-radius:10px;padding:7px 12px;font-weight:600}
.add:disabled{background:#c9d3cf;cursor:default}
.pay{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.pay .sum{flex:1;font-size:14px}.pay .sum b{font-size:17px}
.pay button{border:0;background:var(--night);color:#fff;border-radius:12px;padding:11px 16px;font-weight:700}
.pay button:disabled{background:#c9c7da;cursor:default}
.bk{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.bk .head{display:flex;align-items:baseline;gap:8px}.bk .ref{font-weight:700}.bk .meta{color:var(--mute);font-size:13px;flex:1}
.pill{border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.s-confirmed{background:var(--greenbg);color:var(--green)}.s-processing{background:var(--saffronbg);color:var(--saffron)}
.s-problem{background:var(--redbg);color:var(--red)}.s-refunding,.s-refunded{background:var(--bluebg);color:var(--blue)}
.track{display:flex;gap:4px;margin:12px 0 4px}
.track div{flex:1;font-size:12px;color:var(--mute)}
.track i{display:block;height:5px;border-radius:3px;background:#e6e9e8;margin-bottom:4px}
.track .ok i{background:var(--green)}.track .bad i{background:var(--red)}.track .wait i{background:var(--saffron)}.track .ref i{background:var(--blue)}
.seats{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seat{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:13px;display:flex;gap:6px;align-items:center}
.qr{width:22px;height:22px;border-radius:3px;background:conic-gradient(#1a2421 25%,#fff 0 50%,#1a2421 0 75%,#fff 0) 0 0/8px 8px}
.msg{display:flex;gap:8px;margin-top:10px}
.av{width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.bub{background:var(--greenbg);border-radius:4px 14px 14px 14px;padding:8px 11px;font-size:14px}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:#eef0ef;border-radius:14px 4px 14px 14px}.msg.me .av{background:#8a9490}
.when{font-size:11px;color:var(--mute);margin-top:2px}
.rep{display:flex;gap:6px;margin-top:10px}
.rep input{flex:1;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px}
.rep button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-weight:600}
.empty{color:var(--mute);font-size:14px;padding:6px 2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--night);color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;display:none}
[dir=rtl] .bub{border-radius:14px 4px 14px 14px}[dir=rtl] .msg.me .bub{border-radius:4px 14px 14px 14px}
@media (prefers-reduced-motion:no-preference){.pill{transition:background .3s,color .3s}}
</style>
</head>
<body>
<div class="top">
  <div class="bar"><div class="brand" id="t_brand">Marhaba Pass</div>
    <div class="lang"><button id="en">EN</button><button id="ar">عربي</button></div></div>
  <div class="who"><span id="t_you">Signed in as</span><input id="who" value="Sara" aria-label="Customer name"></div>
  <div class="hero"><h1 id="t_event">Riyadh Nights: the closing concert</h1><p id="t_when">Tonight, 9 PM · Boulevard Arena (fictional)</p></div>
</div>
<main>
  <h2 id="t_tickets">Tickets</h2>
  <div id="types"></div>
  <h2 id="t_bookings">My bookings</h2>
  <div id="bookings"></div>
</main>
<div class="pay"><div class="sum" id="sum">Choose your tickets</div><button id="payBtn" disabled>Pay</button></div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
const T = {
 en:{brand:'Marhaba Pass',you:'Signed in as',event:'Riyadh Nights: the closing concert',when:'Tonight, 9 PM · Boulevard Arena (fictional)',
  tickets:'Tickets',bookings:'My bookings',choose:'Choose your tickets',payNone:'Pay',pay:a=>`Pay ${a} SAR`,add:'Add',left:n=>n?`${n} left`:'Sold out',
  sar:'SAR',none:'No bookings yet. Your tickets will appear here.',tix:n=>n===1?'1 ticket':`${n} tickets`,seat:'Seat',
  states:{confirmed:'Confirmed',processing:'Confirming',problem:'Problem found',refunding:'Refund on its way',refunded:'Refunded'},
  steps:{paid:'Paid',booked:'Booked',tickets:'Tickets sent',problem:'Problem found',fixing:'Being fixed',refund:'Refund approved',refunded:'Refunded'},
  assistant:'Majhar assistant',you2:'You',describe:'Tell us what happened',report:'Report',reported:'We got your message',paid:'Payment sent',
  names:{A:'VIP, front rows',B:'Standard',C:'Economy'}},
 ar:{brand:'مرحبا باس',you:'مسجل باسم',event:'ليالي الرياض: الحفل الختامي',when:'الليلة، 9 مساءً · بوليفارد أرينا (خيالي)',
  tickets:'التذاكر',bookings:'حجوزاتي',choose:'اختر تذاكرك',payNone:'ادفع',pay:a=>`ادفع ${a} ريال`,add:'أضف',left:n=>n?`متبقي ${n}`:'نفدت',
  sar:'ريال',none:'لا توجد حجوزات بعد. ستظهر تذاكرك هنا.',tix:n=>n===1?'تذكرة واحدة':`${n} تذاكر`,seat:'مقعد',
  states:{confirmed:'مؤكد',processing:'جارٍ التأكيد',problem:'وجدنا مشكلة',refunding:'الاسترداد في الطريق',refunded:'تم الاسترداد'},
  steps:{paid:'تم الدفع',booked:'تم الحجز',tickets:'أُرسلت التذاكر',problem:'وجدنا مشكلة',fixing:'جارٍ الحل',refund:'تمت الموافقة على الاسترداد',refunded:'تم الاسترداد'},
  assistant:'مساعد مجهر',you2:'أنت',describe:'أخبرنا بما حدث',report:'إبلاغ',reported:'وصلتنا رسالتك',paid:'تم إرسال الدفع',
  names:{A:'كبار الشخصيات، الصفوف الأمامية',B:'عادي',C:'اقتصادي'}}};
let lang='en', last=null, cart={section:null, qty:1}, busy=false;
try{ lang=localStorage.getItem('mp_lang')||'en'; $('who').value=localStorage.getItem('mp_who')||'Sara'; }catch(e){}
const t=()=>T[lang];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p,b){ const r=await fetch(p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{}); return r.json(); }
function toast(s){ const e=$('toast'); e.textContent=s; e.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>e.style.display='none',2200); }
function setLang(l){ lang=l; try{localStorage.setItem('mp_lang',l);}catch(e){}
  document.documentElement.dir=l==='ar'?'rtl':'ltr'; document.documentElement.lang=l;
  $('en').classList.toggle('on',l==='en'); $('ar').classList.toggle('on',l==='ar');
  for(const k of ['brand','you','event','when','tickets','bookings']) $('t_'+k).textContent=t()[k];
  render(); }
$('en').onclick=()=>setLang('en'); $('ar').onclick=()=>setLang('ar');
$('who').onchange=()=>{ try{localStorage.setItem('mp_who',$('who').value);}catch(e){} refresh(); };
function track(state){
  const s=t().steps, seq={confirmed:[['ok',s.paid],['ok',s.booked],['ok',s.tickets]],
    processing:[['ok',s.paid],['wait',s.booked],['',s.tickets]],
    problem:[['ok',s.paid],['bad',s.problem],['wait',s.fixing]],
    refunding:[['ok',s.paid],['bad',s.problem],['ref',s.refund]],
    refunded:[['ok',s.paid],['bad',s.problem],['ref',s.refunded]]}[state]||[];
  return `<div class="track">${seq.map(([c,l])=>`<div class="${c}"><i></i>${esc(l)}</div>`).join('')}</div>`; }
function render(){
  if(!last||last.busy) return;
  const typed={}; document.querySelectorAll('.rep input').forEach(i=>typed[i.id]=i.value); const focus=document.activeElement&&document.activeElement.id;
  $('types').innerHTML=last.products.map(p=>{ const sel=cart.section===p.section, q=sel?cart.qty:1;
    return `<div class="tt"><div class="grow"><div class="n">${esc(t().names[p.section])}</div>
      <div><span class="p">${p.price}</span> ${t().sar} · <span class="l ${p.left&&p.left<=3?'low':''}">${t().left(p.left)}</span></div></div>
      <div class="step"><button data-dec="${p.section}" ${!p.left?'disabled':''} aria-label="fewer">−</button><span>${sel?cart.qty:1}</span>
      <button data-inc="${p.section}" ${!p.left?'disabled':''} aria-label="more">+</button></div>
      <button class="add" data-add="${p.section}" ${p.left?'':'disabled'}>${t().add}</button></div>`; }).join('');
  document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{ const s=b.dataset.inc, p=last.products.find(x=>x.section===s);
    if(cart.section!==s) cart={section:s,qty:1}; cart.qty=Math.min(4,p.left,cart.qty+1); render(); });
  document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{ const s=b.dataset.dec; if(cart.section!==s) cart={section:s,qty:1}; cart.qty=Math.max(1,cart.qty-1); render(); });
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ if(cart.section!==b.dataset.add) cart={section:b.dataset.add,qty:1}; cart.ready=true; render(); });
  const p=cart.ready&&last.products.find(x=>x.section===cart.section);
  $('sum').innerHTML=p?`<b>${cart.qty} × ${esc(t().names[p.section])}</b><br>${p.price*cart.qty} ${t().sar}`:esc(t().choose);
  $('payBtn').textContent=p?t().pay(p.price*cart.qty):t().payNone;
  $('payBtn').disabled=!p||busy;
  $('bookings').innerHTML=last.bookings.length?last.bookings.map(b=>{
    const msgs=b.messages.map(m=>m.who==='customer'
      ?`<div class="msg me"><div class="av">${esc(t().you2[0])}</div><div><div class="bub">${esc(m.text)}</div><div class="when">${m.time}</div></div></div>`
      :`<div class="msg"><div class="av">م</div><div><div class="bub">${esc(lang==='ar'&&m.text_ar?m.text_ar:m.text)}</div><div class="when">${esc(t().assistant)} · ${m.time}</div></div></div>`).join('');
    const seats=b.tickets.map(x=>`<div class="seat">${b.state==='confirmed'?'<span class="qr"></span>':''}${t().seat} ${esc(x.seat)}</div>`).join('');
    const rep=b.can_report?`<div class="rep"><input id="txt_${b.booking}" placeholder="${esc(t().describe)}"><button data-rep="${b.booking}">${esc(t().report)}</button></div>`:'';
    return `<div class="bk"><div class="head"><span class="ref">${b.booking}</span><span class="meta">${esc(t().tix(b.tickets.length))}, ${esc(t().names[b.section])} · ${b.amount_sar} ${t().sar}</span>
      <span class="pill s-${b.state}">${esc(t().states[b.state]||b.state)}</span></div>${track(b.state)}<div class="seats">${seats}</div>${msgs}${rep}</div>`; }).join('')
    :`<div class="empty">${esc(t().none)}</div>`;
  for(const [id,v] of Object.entries(typed)){ const e=$(id); if(e) e.value=v; }
  if(focus&&$(focus)&&focus.startsWith('txt_')){ const e=$(focus); e.focus(); e.setSelectionRange(e.value.length,e.value.length); }
  document.querySelectorAll('[data-rep]').forEach(btn=>btn.onclick=async()=>{ const ref=btn.dataset.rep, txt=($('txt_'+ref)||{}).value||'';
    await api('/api/report',{booking:ref,text:txt.trim()||(lang==='ar'?'دفعت ولم تصلني التذاكر.':'I paid but I have not received my tickets.')}); toast(t().reported); refresh(); });
}
$('payBtn').onclick=async()=>{ const p=last&&last.products.find(x=>x.section===cart.section); if(!p) return;
  busy=true; render(); const r=await api('/api/buy',{customer:$('who').value,section:cart.section,qty:cart.qty,lang}); busy=false;
  if(r.error){ toast(r.error); render(); return; } cart={section:null,qty:1}; toast(t().paid); refresh(); };
async function refresh(){ try{ last=await api('/api/shop?customer='+encodeURIComponent($('who').value)); render(); }catch(e){} }
setLang(lang); refresh(); setInterval(refresh,1000);
</script>
</body>
</html>
