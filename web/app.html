<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Majhar Demo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20120%20120%22%20width%3D%22120%22%20height%3D%22120%22%20role%3D%22img%22%20aria-label%3D%22Majhar%22%3E%20%20%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%2235%22%20fill%3D%22none%22%20stroke%3D%22%231c1a36%22%20stroke-width%3D%2210%22/%3E%20%20%3Cline%20x1%3D%2276%22%20y1%3D%2276%22%20x2%3D%22103%22%20y2%3D%22103%22%20stroke%3D%22%231c1a36%22%20stroke-width%3D%2215%22%20stroke-linecap%3D%22round%22/%3E%20%20%3Cg%20fill%3D%22%230e6b4f%22%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2235%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2235%22%20r%3D%225.5%22/%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2250%22%20r%3D%225.5%22/%3E%20%20%20%20%3Ccircle%20cx%3D%2235%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2250%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%3Ccircle%20cx%3D%2265%22%20cy%3D%2265%22%20r%3D%225.5%22/%3E%20%20%3C/g%3E%20%20%3Ccircle%20cx%3D%2265%22%20cy%3D%2235%22%20r%3D%227%22%20fill%3D%22%23e3a21a%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--night:#1c1a36;--night2:#262347;--line:#3a3663;--soft:#b9b5dc}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:#fff;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif}
.tabs{display:flex;gap:6px;padding:12px 18px 0}
.tabs button{border:0;background:none;color:var(--soft);font:inherit;font-weight:600;font-size:15px;padding:6px 14px;border-radius:999px;cursor:pointer}
.tabs button.on{background:#fff;color:var(--night)}
.tabs button:focus-visible{outline:3px solid #7aa8ff}
.stage{display:grid;grid-template-columns:400px 1fr;gap:18px;height:calc(100% - 46px);padding:14px 18px 18px}
.results{display:none;height:calc(100% - 46px);padding:14px 18px 18px}
.results iframe{width:100%;height:100%;border:0;border-radius:14px;background:#f3f5f4}
.side{display:flex;flex-direction:column;min-height:0}
.cap{font-size:13px;color:var(--soft);padding:2px 4px 8px}
.cap b{color:#fff;font-weight:600}
.phone{flex:1;min-height:0;border-radius:34px;padding:10px;background:#0f0e22;box-shadow:0 0 0 2px var(--line)}
.phone iframe{width:100%;height:100%;border:0;border-radius:26px;background:#fff}
.desk{flex:1;min-height:0;border-radius:14px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.desk iframe{width:100%;height:100%;border:0;background:#f3f5f4}
@media (max-width:1000px){.stage{grid-template-columns:1fr;height:auto}.phone{height:760px}.desk{height:900px}}
</style>
</head>
<body>
<div class="tabs" role="tablist"><button class="on" id="tDemo" role="tab">Live demo</button><button id="tRes" role="tab">Testing and results</button></div>
<div class="stage" id="stage">
  <div class="side"><div class="cap"><b>The customer</b> buys on her phone</div>
    <div class="phone"><iframe src="/shop" title="Customer shop"></iframe></div></div>
  <div class="side"><div class="cap"><b>Majhar</b>, the AI agent that owns what happens when a payment goes wrong</div>
    <div class="desk"><iframe src="/desk" title="Support desk"></iframe></div></div>
</div>
<div class="results" id="results"><iframe title="Testing and results" id="resFrame"></iframe></div>
<script>
const show=r=>{ document.getElementById('stage').style.display=r?'none':'grid'; document.getElementById('results').style.display=r?'block':'none';
  document.getElementById('tDemo').classList.toggle('on',!r); document.getElementById('tRes').classList.toggle('on',r);
  const f=document.getElementById('resFrame'); if(r&&!f.src) f.src='/results'; };
document.getElementById('tDemo').onclick=()=>show(false); document.getElementById('tRes').onclick=()=>show(true);
</script>
</body>
</html>
